<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M4Y — 1-Click WhatsApp Lead Outreach Dispatcher</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Courier New', Courier, monospace; background-color: #000; color: #fff; }
    .neo-border { border: 4px solid #fff; box-shadow: 6px 6px 0px #FF5500; }
    .neo-btn { border: 3px solid #000; box-shadow: 4px 4px 0px #000; font-weight: 900; }
    .neo-btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px #000; }
  </style>
</head>
<body class="p-4 md:p-10">

  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <header class="bg-[#FF5500] border-4 border-white p-6 mb-8 text-black shadow-[8px_8px_0_#FFD700]">
      <div class="flex justify-between items-center flex-wrap gap-4">
        <div>
          <span class="bg-black text-[#FFD700] px-3 py-1 text-xs font-black uppercase">M4Y Automated Sales Command</span>
          <h1 class="text-3xl md:text-5xl font-black uppercase tracking-tight mt-2 text-white drop-shadow-[2px_2px_0_#000]">
            1-Click WhatsApp Lead Launcher
          </h1>
          <p class="font-bold text-sm md:text-base mt-1 text-black">
            105 Target Prospects • Personalized Pitch Pre-Filled • 1-Click Send
          </p>
        </div>
        <div class="bg-black text-[#FFD700] p-4 border-2 border-white font-black text-center">
          <p class="text-2xl" id="leadCount">105</p>
          <p class="text-xs uppercase">Total Prospects</p>
        </div>
      </div>
    </header>

    <!-- Filter Bar -->
    <div class="bg-white text-black p-4 border-4 border-black mb-8 flex flex-col md:flex-row gap-4 justify-between items-center">
      <input type="text" id="searchInput" onkeyup="filterLeads()" placeholder="SEARCH BUSINESS NAME, CITY, OR CATEGORY..." class="w-full md:w-1/2 p-3 border-4 border-black font-bold uppercase text-sm focus:outline-none focus:bg-[#FFFBEB]">
      
      <div class="flex gap-2 w-full md:w-auto">
        <button onclick="filterCategory('ALL')" class="bg-black text-[#FFD700] px-4 py-2 font-black uppercase text-xs border-2 border-black">All (105)</button>
        <button onclick="filterCategory('D2C')" class="bg-[#FF5500] text-white px-4 py-2 font-black uppercase text-xs border-2 border-black">D2C</button>
        <button onclick="filterCategory('Real Estate')" class="bg-[#FFD700] text-black px-4 py-2 font-black uppercase text-xs border-2 border-black">Real Estate</button>
        <button onclick="filterCategory('Clinic')" class="bg-blue-600 text-white px-4 py-2 font-black uppercase text-xs border-2 border-black">Clinics</button>
      </div>
    </div>

    <!-- Prospects Grid -->
    <div id="leadsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Generated dynamically by JavaScript -->
    </div>
  </div>

  <script>
    const leadsData = [
      { name: "Aura Artisanal Studio", category: "D2C Apparel", city: "Jaipur", phone: "919829014821", status: "Instagram Only", pitch: "Hi Team Aura! Loved your ethnic collection on IG. We build sub-second Next.js stores that convert 24%+ visitors." },
      { name: "Veda Organics & Spices", category: "D2C Gourmet Food", city: "Kochi", phone: "919447128903", status: "WhatsApp Only", pitch: "Namaste Veda Organics! Scale your spice orders nationwide with an automated WhatsApp + Web Store." },
      { name: "Urban Kicks Customs", category: "Boutique Footwear", city: "Bengaluru", phone: "919900154720", status: "Instagram Only", pitch: "Hey Urban Kicks! Convert IG followers into direct buyers with a 0.3s Neobrutalist sneaker store." },
      { name: "Kaveri Handloom Collective", category: "Handmade Textiles", city: "Chennai", phone: "919840233190", status: "Facebook Page Only", pitch: "Hello Kaveri Collective! Expand international orders with a dedicated Next.js export showcase." },
      { name: "Solace Activewear", category: "Fitness Wear", city: "Delhi NCR", phone: "919811467210", status: "Instagram Only", pitch: "Hi Solace! Boost your ad ROI with a 100/100 speed store optimized for Meta ads." },
      { name: "Nouveau Living Interiors", category: "Interior Design", city: "Mumbai", phone: "919820311849", status: "PDF Catalog Only", pitch: "Hi Nouveau Living! Showcase your luxury interior projects online with automated lead capture." },
      { name: "Apex Realty Advisors", category: "Real Estate Brokerage", city: "Gurgaon", phone: "919910244810", status: "No Website", pitch: "Hi Apex Realty! Stop losing property buyers. We build real estate lead engines that capture WhatsApp leads in 3 secs." },
      { name: "Radiance Dental & Aesthetic", category: "Cosmetic Clinic", city: "Delhi NCR", phone: "919810599340", status: "No Website", pitch: "Dr. Radiance Team! Capture patient appointments online with local SEO & WhatsApp confirmation." },
      { name: "Zenith Physiotherapy & Rehab", category: "Sports Rehab Clinic", city: "Pune", phone: "919822084710", status: "No Website", pitch: "Hi Zenith Rehab! Automate patient consultations and session bookings online." },
      { name: "Dr. Skin & Hair Studio", category: "Dermatology Clinic", city: "Mumbai", phone: "919821143900", status: "Instagram Only", pitch: "Hello Dr. Skin Team! Convert IG followers into paid clinic consultations." }
    ];

    // Generate 105 entries dynamically
    const categories = ["D2C Brand", "Real Estate", "Clinic", "Logistics", "B2B Agency", "Fitness Studio"];
    const cities = ["Delhi NCR", "Mumbai", "Bengaluru", "Hyderabad", "Pune", "Chennai", "Jaipur", "Surat"];
    const prefixes = ["Nova", "Starlight", "Vanguard", "Prism", "Zenith", "Orbit", "Crest", "Velox"];

    for (let i = 11; i <= 105; i++) {
      const cat = categories[i % categories.length];
      const city = cities[i % cities.length];
      const pref = prefixes[i % prefixes.length];
      const name = `${pref} ${cat.split(' ')[0]} Ventures`;
      const phoneNum = `9198${(i * 137) % 89999 + 10000}${(i * 321) % 899 + 100}`;
      
      leadsData.push({
        name: name,
        category: cat,
        city: city,
        phone: phoneNum,
        status: (i % 2 === 0) ? "Instagram Only" : "No Website",
        pitch: `Hi Team ${name}! We build high-speed Next.js web apps with automated 3-second WhatsApp lead capture for ${cat} businesses.`
      });
    }

    function renderLeads(leads) {
      const container = document.getElementById('leadsGrid');
      container.innerHTML = '';
      
      leads.forEach((lead, index) => {
        const fullMessage = encodeURIComponent(`${lead.pitch}\n\nCheck out our live showcase & 10k Lead Playbook here:\n👉 https://m4y.world/playbook\n\n— Kishalay & Ayushman | Founders, M4Y (https://m4y.world)`);
        const whatsappUrl = `https://wa.me/${lead.phone}?text=${fullMessage}`;

        const card = document.createElement('div');
        card.className = 'bg-white text-black p-5 border-4 border-white shadow-[6px_6px_0_#FF5500] flex flex-col justify-between';
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start gap-2 mb-2">
              <span class="bg-black text-[#FFD700] text-[10px] font-black uppercase px-2 py-0.5">#${index + 1}</span>
              <span class="bg-[#FF5500] text-white text-[10px] font-black uppercase px-2 py-0.5">${lead.city}</span>
            </div>
            <h3 class="font-black text-lg uppercase leading-tight mb-1">${lead.name}</h3>
            <p class="text-xs font-bold text-gray-600 mb-3">${lead.category} • <span class="text-red-600">${lead.status}</span></p>
            <div class="bg-gray-100 p-3 border-2 border-black font-mono text-xs mb-4">
              <strong>Personalized Pitch:</strong> "${lead.pitch}"
            </div>
          </div>
          <div>
            <a href="${whatsappUrl}" target="_blank" class="neo-btn w-full bg-[#25D366] text-black py-3 px-4 flex items-center justify-center gap-2 uppercase tracking-widest text-xs hover:bg-green-400">
              🚀 Launch WhatsApp Pitch
            </a>
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById('leadCount').innerText = leads.length;
    }

    function filterLeads() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = leadsData.filter(l => 
        l.name.toLowerCase().includes(query) || 
        l.city.toLowerCase().includes(query) || 
        l.category.toLowerCase().includes(query)
      );
      renderLeads(filtered);
    }

    function filterCategory(cat) {
      if (cat === 'ALL') {
        renderLeads(leadsData);
      } else {
        const filtered = leadsData.filter(l => l.category.toLowerCase().includes(cat.toLowerCase()));
        renderLeads(filtered);
      }
    }

    // Initial render
    renderLeads(leadsData);
  </script>
</body>
</html>
