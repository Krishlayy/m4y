    function renderLeads(leads) {
      const container = document.getElementById('leadsGrid');
      container.innerHTML = '';
      
      leads.forEach((lead, index) => {
        const fullMessage = encodeURIComponent(`${lead.pitch}\n\nCheck out our live showcase & 10k Lead Playbook here:\n👉 https://m4y.world/playbook\n\n— Kishalay & Ayushman | Founders, M4Y (https://m4y.world)`);
        const whatsappUrl = `https://wa.me/${lead.phone}?text=${fullMessage}`;

        const card = document.createElement('div');
        card.className = 'bg-white text-black p-5 border-4 border-white shadow-[6px_6px_0_#FF5500] flex flex-col justify-between';
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start gap-2 mb-2">
              <span class="bg-black text-[#FFD700] text-[10px] font-black uppercase px-2 py-0.5">#${index + 1}</span>
              <span class="bg-[#FF5500] text-white text-[10px] font-black uppercase px-2 py-0.5">${lead.city}</span>
            </div>
            <h3 class="font-black text-lg uppercase leading-tight mb-1">${lead.name}</h3>
            <p class="text-xs font-bold text-gray-600 mb-3">${lead.category} • <span class="text-red-600">${lead.status}</span></p>
            <div class="bg-gray-100 p-3 border-2 border-black font-mono text-xs mb-4">
              <strong>Personalized Pitch:</strong> "${lead.pitch}"
            </div>
          </div>
          <div>
            <a href="${whatsappUrl}" target="_blank" class="neo-btn w-full bg-[#25D366] text-black py-3 px-4 flex items-center justify-center gap-2 uppercase tracking-widest text-xs hover:bg-green-400">
              🚀 Launch WhatsApp Pitch
            </a>
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById('leadCount').innerText = leads.length;
    }

    function filterLeads() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = leadsData.filter(l => 
        l.name.toLowerCase().includes(query) || 
        l.city.toLowerCase().includes(query) || 
        l.category.toLowerCase().includes(query)
      );
      renderLeads(filtered);
    }

    function filterCategory(cat) {
      if (cat === 'ALL') {
        renderLeads(leadsData);
      } else {
        const filtered = leadsData.filter(l => l.category.toLowerCase().includes(cat.toLowerCase()));
        renderLeads(filtered);
      }
    }

    // Initial render
    renderLeads(leadsData);
  </script>
