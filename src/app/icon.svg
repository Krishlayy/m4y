
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid Black Background with Heavy Border -->
  <rect width="512" height="512" rx="100" fill="#000000" />
  
  <!-- Outer Neobrutalist Gold Accent Box -->
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="#FFD700" stroke-width="28" />
  
  <!-- Electric Orange Inner Badge -->
  <rect x="56" y="56" width="400" height="400" rx="60" fill="#FF5500" stroke="#000000" stroke-width="24" />
  
  <!-- Stylized M4Y Bold Text with Drop Shadow -->
  <!-- Shadow -->
  <text x="264" y="328" font-family="Impact, Arial Black, sans-serif" font-weight="900" font-size="210" text-anchor="middle" fill="#000000" letter-spacing="-8">M4Y</text>
  
  <!-- Text Fill -->
  <text x="256" y="320" font-family="Impact, Arial Black, sans-serif" font-weight="900" font-size="210" text-anchor="middle" fill="#FFD700" letter-spacing="-8">M4Y</text>
</svg>
